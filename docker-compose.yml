services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/codedrop
      REDIS_URL: redis://redis:6379
    depends_on: [mongo, redis]
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    env_file: server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/codedrop
      REDIS_URL: redis://redis:6379
    depends_on: [mongo, redis]

  listener:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["node", "dist/telegram/listener.js"]
    restart: unless-stopped
    env_file: server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/codedrop
    depends_on: [mongo]

volumes:
  mongo_data:
